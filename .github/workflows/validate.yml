name: validate

# 以扁平安裝檢查 skills 內相對連結。

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install zx
        run: npm install -g zx@8

      - name: Check links
        run: zx scripts/check-links.ts
