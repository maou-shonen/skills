name: omp-dist

# 依 layer 把 skills/ 複製成 omp plugin，推到 omp-dist 分支。main 不放產物，見 docs/adr/0014。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: omp-dist
  cancel-in-progress: false

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install zx
        run: npm install -g zx@8

      - name: Check out current dist
        run: |
          if git ls-remote --exit-code --heads origin omp-dist; then
            git fetch origin omp-dist
            git worktree add dist origin/omp-dist
            git -C dist switch -c omp-dist
          else
            git worktree add --orphan -b omp-dist dist
          fi

      - name: Generate
        run: zx scripts/gen-omp-plugins.ts --out dist

      - name: Push
        working-directory: dist
        run: |
          git add -A
          if git diff --cached --quiet; then echo "dist 已是最新"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898208+github-actions[bot]@users.noreply.github.com" \
            commit -m "dist: ${GITHUB_SHA::7}"
          git push origin omp-dist
